name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'

    - name: Create Base App
      run: flutter create --org com.rana.portrait --project-name rana_portrait_camera app

    - uses: actions/checkout@v3
      with:
        path: custom_code

    - name: Merge Custom Code & Dependencies
      run: |
        cd app
        flutter pub add camera http path_provider
        cp ../custom_code/lib/main.dart lib/main.dart

    - name: Build APK
      run: |
        cd app
        flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Rana-Portrait-Camera
        path: app/build/app/outputs/flutter-apk/app-release.apk
