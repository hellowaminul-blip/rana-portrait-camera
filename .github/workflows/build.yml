name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'

    - name: Build Flutter Skeleton
      run: |
        flutter create --org com.rana.portrait --project-name rana_portrait_camera my_app
        cd my_app
        flutter pub add camera http path_provider
        cp ../lib/main.dart lib/main.dart
        flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Rana-Portrait-Camera
        path: my_app/build/app/outputs/flutter-apk/app-release.apk
